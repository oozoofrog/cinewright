<!doctype html><html lang="ko"><meta charset="utf-8"><style>
body{margin:0;font-family:var(--font-sans);color:var(--foreground)} select{font:inherit;padding:8px;background:var(--secondary);color:var(--foreground);border:1px solid var(--border);border-radius:var(--radius)} figure{margin:14px 0}img{display:block;width:100%;height:auto}figcaption,p{font-size:13px;line-height:1.5;color:var(--muted-foreground)}.chart{background:var(--card);padding:16px;border-radius:var(--radius);margin:16px 0}.row{display:grid;grid-template-columns:90px 1fr 70px;align-items:center;gap:10px;margin:12px 0;font-size:13px}.bar{height:20px;background:var(--chart-1);min-width:2px}.bar.alt{background:var(--chart-2)}[hidden]{display:none}
</style><body><label for="shot">전후 화면 </label><select id="shot" aria-label="비교할 숏 선택"><option value="0">S04 · 편지: 손·종이·시선</option><option value="1">S05 · 역: 인물과 가방</option><option value="2">S06 · 정물: 재질별 획</option><option value="3">S02 · 항구: 도착의 여백</option><option value="4">P01 · 수채: 셀에서 연속 농도로</option><option value="5">P03 · 어깨: 외곽과 변형</option></select><figure data-shot="0" ><img src="/Volumes/eyedisk/develop/cinewright/evidence/cinematic-animation-implementation-2026-11-08/S04/comparison/f156-50.jpg" alt="S04 f156, 왼쪽 원본 오른쪽 수정"><figcaption>편지: 손·종이·시선 · f156 / 24fps · 왼쪽 원본, 오른쪽 수정</figcaption></figure><figure data-shot="1" hidden><img src="/Volumes/eyedisk/develop/cinewright/evidence/cinematic-animation-implementation-2026-11-08/S05/comparison/f156-50.jpg" alt="S05 f156, 왼쪽 원본 오른쪽 수정"><figcaption>역: 인물과 가방 · f156 / 24fps · 왼쪽 원본, 오른쪽 수정</figcaption></figure><figure data-shot="2" hidden><img src="/Volumes/eyedisk/develop/cinewright/evidence/cinematic-animation-implementation-2026-11-08/S06/comparison/f120-50.jpg" alt="S06 f120, 왼쪽 원본 오른쪽 수정"><figcaption>정물: 재질별 획 · f120 / 24fps · 왼쪽 원본, 오른쪽 수정</figcaption></figure><figure data-shot="3" hidden><img src="/Volumes/eyedisk/develop/cinewright/evidence/cinematic-animation-implementation-2026-11-08/S02/comparison/f178-50.jpg" alt="S02 f178, 왼쪽 원본 오른쪽 수정"><figcaption>항구: 도착의 여백 · f178 / 24fps · 왼쪽 원본, 오른쪽 수정</figcaption></figure><figure data-shot="4" hidden><img src="/Volumes/eyedisk/develop/cinewright/evidence/cinematic-animation-implementation-2026-11-08/P01/comparison/f144-50.jpg" alt="P01 f144, 왼쪽 원본 오른쪽 수정"><figcaption>수채: 셀에서 연속 농도로 · f144 / 24fps · 왼쪽 원본, 오른쪽 수정</figcaption></figure><figure data-shot="5" hidden><img src="/Volumes/eyedisk/develop/cinewright/evidence/cinematic-animation-implementation-2026-11-08/P03/comparison/f064-50.jpg" alt="P03 f64, 왼쪽 원본 오른쪽 수정"><figcaption>어깨: 외곽과 변형 · f64 / 24fps · 왼쪽 원본, 오른쪽 수정</figcaption></figure><p>동일 카메라의 정지 프레임 비교입니다. 원속도 리듬·정서에 대한 인간 수락은 남아 있습니다.</p>
<div class="chart" role="img" aria-label="단일 안료 bake 시간: 48x27 48밀리초, 96x54 453밀리초"><strong>수채 해상도와 bake 비용</strong><div class="row"><span>48 × 27</span><div class="bar" style="width:10.6%"></div><span>48ms</span></div><div class="row"><span>96 × 54</span><div class="bar alt" style="width:100%"></div><span>453ms</span></div><p>같은 사건·시드·시간. 최종은 초기 경계가 더 고른 96 × 54를 채택했습니다. 단일 실행 측정이며 침전 분리 채널은 추가하지 않았습니다.</p></div>
<script>document.querySelector('#shot').addEventListener('change',e=>document.querySelectorAll('[data-shot]').forEach(f=>f.hidden=f.dataset.shot!==e.target.value));</script></body></html>
