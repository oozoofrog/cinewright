<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>멀티미디어 연출 검토</title><link rel="icon" href="data:,"><link rel="stylesheet" href="/runtime/style.css">
<script type="importmap">{"imports":{"three":"/vendor/three/three.module.js"}}</script>
</head><body>
<main>
  <h1 id="title">개정본 불러오는 중</h1>
  <canvas id="picture" aria-label="작품 화면"></canvas>
  <section id="controls" aria-label="재생 제어">
    <button id="play" disabled>재생</button>
    <label>프레임 <input id="scrub" type="range" min="0" max="0" value="0"></label>
    <output id="position" for="scrub"></output>
    <label>이동 <select id="jump"><option value="">표식 선택</option></select></label>
    <label>반복 <select id="loop"><option value="">끄기</option></select></label>
    <label><input id="mute" type="checkbox"> 음소거</label>
  </section>
  <p id="error" role="alert" hidden></p>
  <p id="revision"></p>
  <audio id="sound" preload="auto" src="/audio.wav"></audio>
</main>
<script type="module" src="/runtime/player.mjs"></script>
</body></html>
